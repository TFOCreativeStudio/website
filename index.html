<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TFO Creative Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
 
<body>
  <section class="hero">
 
    <!-- ── Header ── -->
    <header class="header">
      <div class="logo">
        <div class="logo-mark">
          <img src="pic/logo1.svg" alt="TFO Logo" />
        </div>
      </div>
 
      <nav class="nav">
        <a href="#">Works</a>
        <a href="#">About Us</a>
        <a href="#">Contact</a>
      </nav>
    </header>
 
    <!-- ── Decorative cross lines ── -->
    <div class="cross"></div>
 
    <!-- ── Main content ── -->
    <main class="content">
      <div class="label">TFO CREATIVE STUDIO</div>
 
      <h1 class="title">
        <span class="title-line"><span class="title-word">CREATE</span></span>
        <span class="title-line"><span class="title-word gray">YOUR</span></span>
        <span class="title-line"><span class="title-word red">VISION</span></span>
      </h1>
 
      <p class="lead">
        AI時代の新しい価値を創造します<br />
        We create new value for the AI era.
      </p>
 
      <a href="#" class="btn">WORKS</a>
    </main>
 
    <!-- ── Background decoration ── -->
    <div class="bg-tfo">TFO</div>
 
    <div class="outline-mark">
      <img src="pic/logo_outline.svg" alt="" aria-hidden="true" />
    </div>
 
    <!-- ── Scroll indicator ── -->
    <div class="scroll">scroll</div>
 
  </section>
</body>
</html>
